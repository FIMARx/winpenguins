name: Build, Test & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WinPenguins.slnx

      - name: Run full WinPenguins verification suite
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Full

      - name: Publish standalone WinPenguins.exe
        run: dotnet publish src/WinPenguins/WinPenguins.csproj -p:PublishProfile=SingleFile -o publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPenguins-win-x64
          path: publish/WinPenguins.exe
          if-no-files-found: error

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/WinPenguins.exe
          generate_release_notes: true
